<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>编辑商品 · 校园二手</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><span class="brand-logo">循</span><span>校园二手</span></div>
      <div class="nav-label">工作台</div>
      <nav class="nav">
        <a class="nav-item" href="/"><span class="nav-icon">⌂</span>总览</a>
        <a class="nav-item" href="/market.html" data-role="BUYER SELLER ADMIN"><span class="nav-icon">⌕</span>商品市场</a>
        <a class="nav-item" href="/reservations.html" data-role="BUYER"><span class="nav-icon">◷</span>我的预约</a>
      </nav>
      <div class="nav-label">卖家中心</div>
      <nav class="nav">
        <a class="nav-item active" href="/seller/products.html" data-role="SELLER"><span class="nav-icon">▤</span>商品管理</a>
        <a class="nav-item" href="/seller/reservations.html" data-role="SELLER"><span class="nav-icon">⇄</span>预约处理</a>
      </nav>
      <div class="nav-label">平台管理</div>
      <nav class="nav">
        <a class="nav-item" href="/admin/review.html" data-role="ADMIN"><span class="nav-icon">✓</span>审核与违规</a>
        <a class="nav-item" href="/admin/violations.html" data-role="ADMIN"><span class="nav-icon">!</span>违规处理</a>
        <a class="nav-item" href="/admin/users.html" data-role="ADMIN"><span class="nav-icon">♙</span>用户管理</a>
        <a class="nav-item" href="/admin/logs.html" data-role="ADMIN"><span class="nav-icon">≡</span>操作日志</a>
        <a class="nav-item" href="/stats.html" data-role="SELLER ADMIN"><span class="nav-icon">◫</span>统计看板</a>
      </nav>
      <div class="sidebar-foot"><small>课程项目原型 · v0.4</small><br><small>线下交易 · 不做在线支付</small></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">卖家中心 / 商品编辑</div>
        <div class="topbar-actions">
          <div class="user-pill"><span class="avatar" id="avatar">?</span><span class="user-meta"><strong id="displayName">加载中</strong><span id="roleLabel">—</span></span></div>
          <button class="btn btn-ghost btn-sm" id="logoutButton" type="button">退出登录</button>
        </div>
      </header>

      <main class="content">
        <div class="page-head">
          <div>
            <a class="text-link" href="/seller/products.html">← 返回商品管理</a>
            <h1 style="margin-top:10px" id="pageTitle">新建商品</h1>
            <p id="pageSubtitle">保存草稿后可以继续编辑；提交审核后进入管理员审核队列。</p>
          </div>
          <span class="badge badge-gray" id="editStatus">新建</span>
        </div>

        <div class="alert alert-error" id="editAlert"></div>
        <div class="card card-pad">
          <form id="productForm" class="form-grid">
            <input type="hidden" id="productId">
            <input type="hidden" id="version">
            <div class="form-row">
              <div class="field">
                <label for="title">商品标题</label>
                <input id="title" maxlength="80" required placeholder="例如：九成新机械键盘">
                <div class="field-error" id="titleError"></div>
              </div>
              <div class="field">
                <label for="categoryId">分类</label>
                <select id="categoryId" required><option value="">请选择分类</option></select>
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="price">价格（元）</label>
                <input id="price" inputmode="decimal" required placeholder="例如：299.00">
                <div class="hint">必须大于 0，最多 1,000,000 元，最多两位小数。</div>
              </div>
              <div class="field">
                <label for="condition">成色</label>
                <select id="condition" required>
                  <option value="NEW">全新</option>
                  <option value="LIKE_NEW" selected>几乎全新</option>
                  <option value="GOOD">成色良好</option>
                  <option value="FAIR">有使用痕迹</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="imageUrl">图片地址（选填）</label>
              <input id="imageUrl" maxlength="500" placeholder="https://...；留空时使用默认占位图">
            </div>
            <div class="field">
              <label for="description">商品描述</label>
              <textarea id="description" rows="7" maxlength="2000" required placeholder="描述商品成色、使用情况、配件和线下交付方式。不要填写完整联系方式。"></textarea>
              <div class="hint">10-2000 个字符。审核通过后买家可以看到这段描述。</div>
            </div>
            <div class="notice blue" id="editNotice" style="display:none"></div>
            <div class="notice red" id="reviewNotice" style="display:none"></div>
            <div class="form-actions">
              <a class="btn btn-ghost" href="/seller/products.html">取消</a>
              <button class="btn btn-ghost" type="button" id="saveButton">保存草稿</button>
              <button class="btn btn-primary" type="button" id="saveSubmitButton">保存并提交审核</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
  <script src="/seller-product-edit.js"></script>
</body>
</html>
