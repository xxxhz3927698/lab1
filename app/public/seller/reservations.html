<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>预约处理 · 校园二手</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><span class="brand-logo">循</span><span>校园二手</span></div>
      <div class="nav-label">工作台</div>
      <nav class="nav">
        <a class="nav-item" href="/"><span class="nav-icon">⌂</span>总览</a>
        <a class="nav-item" href="/market.html" data-role="BUYER SELLER ADMIN"><span class="nav-icon">⌕</span>商品市场</a>
        <a class="nav-item" href="/reservations.html" data-role="BUYER"><span class="nav-icon">◷</span>我的预约</a>
      </nav>
      <div class="nav-label">卖家中心</div>
      <nav class="nav">
        <a class="nav-item" href="/seller/products.html" data-role="SELLER"><span class="nav-icon">▤</span>商品管理</a>
        <a class="nav-item active" href="/seller/reservations.html" data-role="SELLER"><span class="nav-icon">⇄</span>预约处理</a>
      </nav>
      <div class="nav-label">平台管理</div>
      <nav class="nav">
        <a class="nav-item" href="/admin/review.html" data-role="ADMIN"><span class="nav-icon">✓</span>审核与违规</a>
        <a class="nav-item" href="/admin/violations.html" data-role="ADMIN"><span class="nav-icon">!</span>违规处理</a>
        <a class="nav-item" href="/admin/users.html" data-role="ADMIN"><span class="nav-icon">♙</span>用户管理</a>
        <a class="nav-item" href="/admin/logs.html" data-role="ADMIN"><span class="nav-icon">≡</span>操作日志</a>
        <a class="nav-item" href="/stats.html" data-role="SELLER ADMIN"><span class="nav-icon">◫</span>统计看板</a>
      </nav>
      <div class="sidebar-foot"><small>课程项目原型 · v0.4</small><br><small>线下交易 · 不做在线支付</small></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">卖家中心 / 预约处理</div>
        <div class="topbar-actions">
          <div class="user-pill"><span class="avatar" id="avatar">?</span><span class="user-meta"><strong id="displayName">加载中</strong><span id="roleLabel">—</span></span></div>
          <button class="btn btn-ghost btn-sm" id="logoutButton" type="button">退出登录</button>
        </div>
      </header>

      <main class="content">
        <section class="page-head">
          <div>
            <h1>预约处理</h1>
            <p>同一商品可以有多条待确认预约，确认一条后其他待确认预约自动拒绝。确认前请核对买家留言和线下交付条件。</p>
          </div>
          <span class="badge badge-amber" id="pendingCount">—</span>
        </section>

        <form class="card filter-card" id="filterForm">
          <div class="filter-grid" style="grid-template-columns: 1fr 1fr auto">
            <div class="field"><label for="status">状态</label>
              <select id="status">
                <option value="">全部状态</option>
                <option value="PENDING">待确认</option>
                <option value="CONFIRMED">已确认</option>
                <option value="COMPLETED">已完成</option>
                <option value="CANCELLED">已取消</option>
                <option value="REJECTED">已拒绝</option>
                <option value="EXPIRED">已过期</option>
              </select>
            </div>
            <div class="field"><label for="productId">商品编号</label><input id="productId" inputmode="numeric" placeholder="不填表示全部"></div>
            <button class="btn btn-primary" type="submit">筛选</button>
          </div>
        </form>

        <div class="alert alert-info show" style="display:block;margin-bottom:14px">
          提示：确认预约后商品变为“已预订”；完成交易后变为“已售出”。已确认预约超过 7 天未完成会自动过期并释放商品。
        </div>
        <div class="alert alert-error" id="listAlert"></div>
        <section class="review-grid" id="sellerReservationList">
          <div class="card empty"><strong>正在加载预约</strong><span>请稍候…</span></div>
        </section>
        <div class="pager">
          <span id="pageInfo">—</span>
          <div class="pager-actions">
            <button class="btn btn-ghost btn-sm" id="prevPage" type="button">上一页</button>
            <button class="btn btn-ghost btn-sm" id="nextPage" type="button">下一页</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
  <script src="/seller-reservations.js"></script>
</body>
</html>
