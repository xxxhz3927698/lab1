<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品市场 · 校园二手</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><span class="brand-logo">循</span><span>校园二手</span></div>
      <div class="nav-label">工作台</div>
      <nav class="nav">
        <a class="nav-item" href="/"><span class="nav-icon">⌂</span>总览</a>
        <a class="nav-item active" href="/market.html" data-role="BUYER SELLER ADMIN"><span class="nav-icon">⌕</span>商品市场</a>
        <a class="nav-item" href="/reservations.html" data-role="BUYER" data-soon><span class="nav-icon">◷</span>我的预约</a>
      </nav>
      <div class="nav-label">卖家中心</div>
      <nav class="nav">
        <a class="nav-item" href="/seller/products.html" data-role="SELLER"><span class="nav-icon">▤</span>商品管理</a>
        <a class="nav-item" href="/seller/reservations.html" data-role="SELLER" data-soon><span class="nav-icon">⇄</span>预约处理</a>
      </nav>
      <div class="nav-label">平台管理</div>
      <nav class="nav">
        <a class="nav-item" href="/admin/review.html" data-role="ADMIN"><span class="nav-icon">✓</span>审核与违规</a>
        <a class="nav-item" href="/admin/users.html" data-role="ADMIN" data-soon><span class="nav-icon">♙</span>用户管理</a>
        <a class="nav-item" href="/admin/logs.html" data-role="ADMIN" data-soon><span class="nav-icon">≡</span>操作日志</a>
        <a class="nav-item" href="/stats.html" data-role="SELLER ADMIN" data-soon><span class="nav-icon">◫</span>统计看板</a>
      </nav>
      <div class="sidebar-foot"><small>课程项目原型 · v0.2</small><br><small>线下交易 · 不做在线支付</small></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">商品市场 / 查询</div>
        <div class="topbar-actions">
          <div class="user-pill">
            <span class="avatar" id="avatar">?</span>
            <span class="user-meta"><strong id="displayName">加载中</strong><span id="roleLabel">—</span></span>
          </div>
          <button class="btn btn-ghost btn-sm" id="logoutButton" type="button">退出登录</button>
        </div>
      </header>

      <main class="content">
        <section class="page-head">
          <div>
            <h1>商品市场</h1>
            <p>按关键词、分类、价格和状态组合查询。默认展示在售与已预订商品；实际交易线下完成。</p>
          </div>
          <div class="page-actions">
            <span class="badge badge-blue" id="marketCount">—</span>
            <a class="btn btn-ghost btn-sm" href="/seller/products.html" data-role="SELLER">发布商品</a>
          </div>
        </section>

        <form class="card filter-card" id="filterForm">
          <div class="filter-grid">
            <div class="field">
              <label for="q">关键词</label>
              <input id="q" name="q" placeholder="搜索标题或描述，例如：键盘">
            </div>
            <div class="field">
              <label for="categoryId">分类</label>
              <select id="categoryId" name="categoryId"><option value="">全部分类</option></select>
            </div>
            <div class="field">
              <label for="minPrice">最低价</label>
              <input id="minPrice" name="minPrice" inputmode="decimal" placeholder="0">
            </div>
            <div class="field">
              <label for="maxPrice">最高价</label>
              <input id="maxPrice" name="maxPrice" inputmode="decimal" placeholder="不限">
            </div>
            <div class="field">
              <label for="status">状态</label>
              <select id="status" name="status">
                <option value="">在售 + 已预订</option>
                <option value="ON_SALE">仅看有货</option>
                <option value="RESERVED">仅看已预订</option>
              </select>
            </div>
            <div class="field">
              <label for="sort">排序</label>
              <select id="sort" name="sort">
                <option value="newest">最新发布</option>
                <option value="price_asc">价格从低到高</option>
                <option value="price_desc">价格从高到低</option>
              </select>
            </div>
            <button class="btn btn-primary" type="submit">查询</button>
          </div>
        </form>

        <div class="alert alert-error" id="marketAlert"></div>
        <section class="product-grid" id="productGrid">
          <div class="card empty product-empty"><strong>正在加载商品</strong><span>请稍候…</span></div>
        </section>
        <div class="pager">
          <span id="pageInfo">—</span>
          <div class="pager-actions">
            <button class="btn btn-ghost btn-sm" id="prevPage" type="button">上一页</button>
            <button class="btn btn-ghost btn-sm" id="nextPage" type="button">下一页</button>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
  <script src="/market.js"></script>
</body>
</html>
