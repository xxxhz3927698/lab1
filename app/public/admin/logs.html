<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>操作日志 · 校园二手</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><span class="brand-logo">循</span><span>校园二手</span></div>
      <div class="nav-label">工作台</div>
      <nav class="nav">
        <a class="nav-item" href="/"><span class="nav-icon">⌂</span>总览</a>
        <a class="nav-item" href="/market.html" data-role="BUYER SELLER ADMIN"><span class="nav-icon">⌕</span>商品市场</a>
        <a class="nav-item" href="/reservations.html" data-role="BUYER"><span class="nav-icon">◷</span>我的预约</a>
      </nav>
      <div class="nav-label">卖家中心</div>
      <nav class="nav">
        <a class="nav-item" href="/seller/products.html" data-role="SELLER"><span class="nav-icon">▤</span>商品管理</a>
        <a class="nav-item" href="/seller/reservations.html" data-role="SELLER"><span class="nav-icon">⇄</span>预约处理</a>
      </nav>
      <div class="nav-label">平台管理</div>
      <nav class="nav">
        <a class="nav-item" href="/admin/review.html" data-role="ADMIN"><span class="nav-icon">✓</span>审核与违规</a>
        <a class="nav-item" href="/admin/violations.html" data-role="ADMIN"><span class="nav-icon">!</span>违规处理</a>
        <a class="nav-item" href="/admin/users.html" data-role="ADMIN"><span class="nav-icon">♙</span>用户管理</a>
        <a class="nav-item active" href="/admin/logs.html" data-role="ADMIN"><span class="nav-icon">≡</span>操作日志</a>
        <a class="nav-item" href="/stats.html" data-role="SELLER ADMIN"><span class="nav-icon">◫</span>统计看板</a>
      </nav>
      <div class="sidebar-foot"><small>课程项目原型 · v0.4</small><br><small>线下交易 · 不做在线支付</small></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">平台管理 / 操作日志</div>
        <div class="topbar-actions">
          <div class="user-pill"><span class="avatar" id="avatar">?</span><span class="user-meta"><strong id="displayName">加载中</strong><span id="roleLabel">—</span></span></div>
          <button class="btn btn-ghost btn-sm" id="logoutButton" type="button">退出登录</button>
        </div>
      </header>

      <main class="content">
        <section class="page-head">
          <div>
            <h1>操作日志</h1>
            <p>查询注册、登录、商品审核、预约状态变化、违规移除和用户禁用等关键操作。</p>
          </div>
          <span class="badge badge-blue" id="logCount">—</span>
        </section>

        <form class="card filter-card" id="filterForm">
          <div class="filter-grid" style="grid-template-columns: repeat(4, minmax(130px,1fr)) auto">
            <div class="field"><label for="actorId">操作者编号</label><input id="actorId" inputmode="numeric" placeholder="用户 ID"></div>
            <div class="field"><label for="actionType">操作类型</label><input id="actionType" placeholder="例如 PRODUCT_APPROVE"></div>
            <div class="field"><label for="targetType">目标类型</label><select id="targetType"><option value="">全部</option><option>USER</option><option>PRODUCT</option><option>RESERVATION</option></select></div>
            <div class="field"><label for="targetId">目标编号</label><input id="targetId" inputmode="numeric" placeholder="对象 ID"></div>
            <div class="field"><input id="q" placeholder="请求编号 / 原因 / 账号"></div>
            <div class="field"><label for="from">开始日期</label><input id="from" type="date"></div>
            <div class="field"><label for="to">结束日期</label><input id="to" type="date"></div>
            <button class="btn btn-primary" type="submit">查询</button>
          </div>
        </form>

        <div class="alert alert-error" id="listAlert"></div>
        <section class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>时间</th><th>操作者</th><th>操作</th><th>目标</th><th>状态变化</th><th>原因</th><th>请求编号 / IP</th></tr></thead>
              <tbody id="logRows"><tr><td colspan="7"><div class="empty">正在加载…</div></td></tr></tbody>
            </table>
          </div>
          <div class="pager" style="padding:14px 18px">
            <span id="pageInfo">—</span>
            <div class="pager-actions">
              <button class="btn btn-ghost btn-sm" id="prevPage" type="button">上一页</button>
              <button class="btn btn-ghost btn-sm" id="nextPage" type="button">下一页</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
  <script src="/admin-logs.js"></script>
</body>
</html>
