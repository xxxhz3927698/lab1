<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>违规处理 · 校园二手</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><span class="brand-logo">循</span><span>校园二手</span></div>
      <div class="nav-label">工作台</div>
      <nav class="nav">
        <a class="nav-item" href="/"><span class="nav-icon">⌂</span>总览</a>
        <a class="nav-item" href="/market.html" data-role="BUYER SELLER ADMIN"><span class="nav-icon">⌕</span>商品市场</a>
        <a class="nav-item" href="/reservations.html" data-role="BUYER"><span class="nav-icon">◷</span>我的预约</a>
      </nav>
      <div class="nav-label">卖家中心</div>
      <nav class="nav">
        <a class="nav-item" href="/seller/products.html" data-role="SELLER"><span class="nav-icon">▤</span>商品管理</a>
        <a class="nav-item" href="/seller/reservations.html" data-role="SELLER"><span class="nav-icon">⇄</span>预约处理</a>
      </nav>
      <div class="nav-label">平台管理</div>
      <nav class="nav">
        <a class="nav-item" href="/admin/review.html" data-role="ADMIN"><span class="nav-icon">✓</span>审核与违规</a>
        <a class="nav-item active" href="/admin/violations.html" data-role="ADMIN"><span class="nav-icon">!</span>违规处理</a>
        <a class="nav-item" href="/admin/users.html" data-role="ADMIN"><span class="nav-icon">♙</span>用户管理</a>
        <a class="nav-item" href="/admin/logs.html" data-role="ADMIN"><span class="nav-icon">≡</span>操作日志</a>
        <a class="nav-item" href="/stats.html" data-role="SELLER ADMIN"><span class="nav-icon">◫</span>统计看板</a>
      </nav>
      <div class="sidebar-foot"><small>课程项目原型 · v0.4</small><br><small>线下交易 · 不做在线支付</small></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">平台管理 / 违规处理</div>
        <div class="topbar-actions">
          <div class="user-pill"><span class="avatar" id="avatar">?</span><span class="user-meta"><strong id="displayName">加载中</strong><span id="roleLabel">—</span></span></div>
          <button class="btn btn-ghost btn-sm" id="logoutButton" type="button">退出登录</button>
        </div>
      </header>

      <main class="content">
        <section class="page-head">
          <div>
            <h1>违规处理</h1>
            <p>对在售、待审核或已预订商品执行违规移除。移除后相关预约同步取消，已售出商品不受影响。</p>
          </div>
          <span class="badge badge-red" id="productCount">—</span>
        </section>

        <form class="card filter-card" id="filterForm">
          <div class="filter-grid" style="grid-template-columns: 2fr 1fr 1fr auto">
            <div class="field"><label for="q">关键词 / 商品编号</label><input id="q" placeholder="标题、卖家或商品编号"></div>
            <div class="field"><label for="status">状态</label>
              <select id="status">
                <option value="ON_SALE">在售</option>
                <option value="RESERVED">已预订</option>
                <option value="PENDING_REVIEW">待审核</option>
                <option value="">全部</option>
              </select>
            </div>
            <div class="field"><label>&nbsp;</label><button class="btn btn-primary" type="submit" style="width:100%">查询</button></div>
          </div>
        </form>

        <div class="alert alert-error" id="listAlert"></div>
        <section class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>商品</th><th>卖家</th><th>分类</th><th>价格</th><th>状态</th><th>版本</th><th>操作</th></tr></thead>
              <tbody id="productRows"><tr><td colspan="7"><div class="empty">正在加载…</div></td></tr></tbody>
            </table>
          </div>
          <div class="pager" style="padding:14px 18px">
            <span id="pageInfo">—</span>
            <div class="pager-actions">
              <button class="btn btn-ghost btn-sm" id="prevPage" type="button">上一页</button>
              <button class="btn btn-ghost btn-sm" id="nextPage" type="button">下一页</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
  <script src="/admin-violations.js"></script>
</body>
</html>
