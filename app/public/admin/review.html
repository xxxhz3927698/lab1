<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>审核与违规 · 校园二手</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><span class="brand-logo">循</span><span>校园二手</span></div>
      <div class="nav-label">工作台</div>
      <nav class="nav">
        <a class="nav-item" href="/"><span class="nav-icon">⌂</span>总览</a>
        <a class="nav-item" href="/market.html" data-role="BUYER SELLER ADMIN"><span class="nav-icon">⌕</span>商品市场</a>
        <a class="nav-item" href="/reservations.html" data-role="BUYER"><span class="nav-icon">◷</span>我的预约</a>
      </nav>
      <div class="nav-label">卖家中心</div>
      <nav class="nav">
        <a class="nav-item" href="/seller/products.html" data-role="SELLER"><span class="nav-icon">▤</span>商品管理</a>
        <a class="nav-item" href="/seller/reservations.html" data-role="SELLER"><span class="nav-icon">⇄</span>预约处理</a>
      </nav>
      <div class="nav-label">平台管理</div>
      <nav class="nav">
        <a class="nav-item active" href="/admin/review.html" data-role="ADMIN"><span class="nav-icon">✓</span>审核与违规</a>
        <a class="nav-item" href="/admin/violations.html" data-role="ADMIN"><span class="nav-icon">!</span>违规处理</a>
        <a class="nav-item" href="/admin/users.html" data-role="ADMIN"><span class="nav-icon">♙</span>用户管理</a>
        <a class="nav-item" href="/admin/logs.html" data-role="ADMIN"><span class="nav-icon">≡</span>操作日志</a>
        <a class="nav-item" href="/stats.html" data-role="SELLER ADMIN"><span class="nav-icon">◫</span>统计看板</a>
      </nav>
      <div class="sidebar-foot"><small>课程项目原型 · v0.4</small><br><small>线下交易 · 不做在线支付</small></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">平台管理 / 审核与违规</div>
        <div class="topbar-actions">
          <div class="user-pill"><span class="avatar" id="avatar">?</span><span class="user-meta"><strong id="displayName">加载中</strong><span id="roleLabel">—</span></span></div>
          <button class="btn btn-ghost btn-sm" id="logoutButton" type="button">退出登录</button>
        </div>
      </header>

      <main class="content">
        <section class="page-head">
          <div>
            <h1>商品审核</h1>
            <p>审核卖家提交的商品。驳回必须填写理由；审核期间商品不会出现在公开市场。</p>
          </div>
          <span class="badge badge-amber" id="pendingCount">—</span>
        </section>

        <form class="card filter-card" id="filterForm">
          <div class="filter-grid" style="grid-template-columns: 2fr auto">
            <div class="field"><label for="q">关键词</label><input id="q" placeholder="商品标题或卖家昵称"></div>
            <button class="btn btn-primary" type="submit">查询</button>
          </div>
        </form>

        <div class="alert alert-error" id="reviewAlert"></div>
        <section class="review-grid" id="reviewList">
          <div class="card empty"><strong>正在加载待审核商品</strong><span>请稍候…</span></div>
        </section>
        <div class="pager">
          <span id="pageInfo">—</span>
          <div class="pager-actions">
            <button class="btn btn-ghost btn-sm" id="prevPage" type="button">上一页</button>
            <button class="btn btn-ghost btn-sm" id="nextPage" type="button">下一页</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="rejectModal">
    <div class="modal-card">
      <div class="modal-head"><h3>驳回商品</h3><button class="btn btn-ghost btn-sm" type="button" id="closeModal">关闭</button></div>
      <div class="modal-body">
        <div class="field">
          <label for="rejectReason">驳回理由</label>
          <textarea id="rejectReason" rows="5" maxlength="500" placeholder="请说明具体原因，卖家可以看到这段理由并修改后重新提交。"></textarea>
          <div class="hint">2-500 个字符，不能为空。</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" id="cancelReject">取消</button>
        <button class="btn btn-danger" type="button" id="confirmReject">确认驳回</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
  <script src="/admin-review.js"></script>
</body>
</html>
