<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统计看板 · 校园二手</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mark"><span class="brand-logo">循</span><span>校园二手</span></div>
      <div class="nav-label">工作台</div>
      <nav class="nav">
        <a class="nav-item" href="/"><span class="nav-icon">⌂</span>总览</a>
        <a class="nav-item" href="/market.html" data-role="BUYER SELLER ADMIN"><span class="nav-icon">⌕</span>商品市场</a>
        <a class="nav-item" href="/reservations.html" data-role="BUYER"><span class="nav-icon">◷</span>我的预约</a>
      </nav>
      <div class="nav-label">卖家中心</div>
      <nav class="nav">
        <a class="nav-item" href="/seller/products.html" data-role="SELLER"><span class="nav-icon">▤</span>商品管理</a>
        <a class="nav-item" href="/seller/reservations.html" data-role="SELLER"><span class="nav-icon">⇄</span>预约处理</a>
      </nav>
      <div class="nav-label">平台管理</div>
      <nav class="nav">
        <a class="nav-item" href="/admin/review.html" data-role="ADMIN"><span class="nav-icon">✓</span>审核与违规</a>
        <a class="nav-item" href="/admin/violations.html" data-role="ADMIN"><span class="nav-icon">!</span>违规处理</a>
        <a class="nav-item" href="/admin/users.html" data-role="ADMIN"><span class="nav-icon">♙</span>用户管理</a>
        <a class="nav-item" href="/admin/logs.html" data-role="ADMIN"><span class="nav-icon">≡</span>操作日志</a>
        <a class="nav-item active" href="/stats.html" data-role="SELLER ADMIN"><span class="nav-icon">◫</span>统计看板</a>
      </nav>
      <div class="sidebar-foot"><small>课程项目原型 · v0.4</small><br><small>线下交易 · 不做在线支付</small></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">数据 / 统计看板</div>
        <div class="topbar-actions">
          <div class="user-pill"><span class="avatar" id="avatar">?</span><span class="user-meta"><strong id="displayName">加载中</strong><span id="roleLabel">—</span></span></div>
          <button class="btn btn-ghost btn-sm" id="logoutButton" type="button">退出登录</button>
        </div>
      </header>

      <main class="content">
        <section class="page-head">
          <div>
            <h1>统计看板</h1>
            <p id="statsSubtitle">卖家查看自己的商品与预约；管理员查看平台整体状态。</p>
          </div>
          <span class="badge badge-blue" id="statsRole">—</span>
        </section>

        <form class="card filter-card" id="rangeForm">
          <div class="filter-grid" style="grid-template-columns: 1fr 1fr auto">
            <div class="field"><label for="from">开始日期</label><input id="from" type="date"></div>
            <div class="field"><label for="to">结束日期</label><input id="to" type="date"></div>
            <button class="btn btn-primary" type="submit">刷新统计</button>
          </div>
        </form>

        <div class="alert alert-error" id="statsAlert"></div>
        <div id="statsRoot">
          <div class="card empty"><strong>正在加载统计</strong><span>请稍候…</span></div>
        </div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
  <script src="/stats.js"></script>
</body>
</html>
