<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>统计看板</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone ">
    <div class="statusbar"><span>9:41</span><span class="status-right"><span class="status-bars">▮▮▮</span><span>5G</span><span>▰</span></span></div>
    <div class="app">
      <div class="content "><div class="page-header"><div class="header-left"><div><h1>统计看板</h1><p>平台商品、预约和交易概览</p></div></div><div><div class="header-icon">↻</div></div></div>
<div class="filter-row"><div class="filter-pill">近 30 天 <span>⌄</span></div><div class="filter-pill">全部分类 <span>⌄</span></div></div>
<div class="kpi-grid"><div class="kpi yellow"><span>平台商品</span><strong>29</strong></div><div class="kpi"><span>完成交易</span><strong>18</strong></div><div class="kpi"><span>成交率</span><strong>72%</strong></div><div class="kpi"><span>待处理预约</span><strong>6</strong></div></div>
<div class="chart-card"><h3>商品状态分布</h3><div class="bar-row"><span>在售</span><div class="bar-track"><div class="bar-fill" style="width:78%"></div></div><span class="bar-value">12</span></div><div class="bar-row"><span>已预订</span><div class="bar-track"><div class="bar-fill dark" style="width:35%"></div></div><span class="bar-value">4</span></div><div class="bar-row"><span>待审核</span><div class="bar-track"><div class="bar-fill green" style="width:22%"></div></div><span class="bar-value">3</span></div><div class="bar-row"><span>已售出</span><div class="bar-track"><div class="bar-fill" style="width:55%"></div></div><span class="bar-value">8</span></div></div>
<div class="chart-card"><h3>每日完成交易</h3><div class="bar-row"><span>11-08</span><div class="bar-track"><div class="bar-fill dark" style="width:32%"></div></div><span class="bar-value">2</span></div><div class="bar-row"><span>11-09</span><div class="bar-track"><div class="bar-fill dark" style="width:52%"></div></div><span class="bar-value">4</span></div><div class="bar-row"><span>11-10</span><div class="bar-track"><div class="bar-fill dark" style="width:78%"></div></div><span class="bar-value">6</span></div><div class="bar-row"><span>11-11</span><div class="bar-track"><div class="bar-fill dark" style="width:100%"></div></div><span class="bar-value">8</span></div></div></div>
    </div>
    <div class="bottom-nav"><div class="nav-item"><span class="nav-icon">✓</span><span>审核</span></div><div class="nav-item"><span class="nav-icon">!</span><span>违规</span></div><div class="nav-item"><span class="nav-icon">♙</span><span>用户</span></div><div class="nav-item"><span class="nav-icon">≡</span><span>日志</span></div><div class="nav-item active"><span class="nav-icon">◫</span><span>统计</span></div></div>
  </div>
</body>
</html>
