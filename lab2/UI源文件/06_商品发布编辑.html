<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品发布编辑</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone ">
    <div class="statusbar"><span>9:41</span><span class="status-right"><span class="status-bars">▮▮▮</span><span>5G</span><span>▰</span></span></div>
    <div class="app">
      <div class="content edit-content"><div class="page-header"><div class="header-left"><div class="back">‹</div><div><h1>发布闲置</h1><p>完整填写后提交管理员审核</p></div></div></div>
<div class="pad" style="padding-top:12px;padding-bottom:86px">
  <div class="form-card">
    <div class="field"><label>商品图片</label><div style="display:flex;gap:8px"><div class="upload-box">＋</div><div class="upload-box">⌨</div><div class="upload-box">◌</div></div></div>
    <div class="field" style="margin-top:14px"><label>标题</label><input class="input" value="九成新机械键盘，键帽完整"></div>
    <div class="field" style="margin-top:12px"><label>描述</label><textarea class="textarea" rows="4">自用机械键盘，功能正常，键帽完整，附原装数据线。支持图书馆门口线下验货。</textarea></div>
    <div class="form-row" style="margin-top:12px"><div class="field"><label>分类</label><select class="select"><option>数码电子</option></select></div><div class="field"><label>价格</label><input class="input" value="299.00"></div></div>
    <div class="field" style="margin-top:12px"><label>成色</label><div class="chips" style="margin-top:0"><span class="chip">全新</span><span class="chip active">几乎全新</span><span class="chip">成色良好</span><span class="chip">有使用痕迹</span></div></div>
    <div class="notice" style="margin-top:14px">提交审核后商品会从公开市场暂时移除，审核通过后恢复在售。</div>
  </div>
</div>
<div class="detail-action"><button class="btn btn-ghost" style="width:110px">保存草稿</button><button class="btn btn-yellow" style="flex:1;height:45px;font-size:14px">提交审核</button></div></div>
    </div>
    
  </div>
</body>
</html>
