<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录注册</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone login-phone">
    <div class="statusbar"><span>9:41</span><span class="status-right"><span class="status-bars">▮▮▮</span><span>5G</span><span>▰</span></span></div>
    <div class="app">
      <div class="content login-content"><div class="login-screen">
  <div class="login-top">
    <div class="login-logo">循</div>
    <h1>让闲置<br><span>继续流动</span></h1>
    <p>校园里的二手好物，线下验货、当面交付。预约撮合，不做在线支付。</p>
  </div>
  <div class="login-card">
    <h2>欢迎回来</h2>
    <div class="sub">登录后即可浏览、预约和管理闲置</div>
    <div class="login-tabs"><button class="login-tab active">登录</button><button class="login-tab">注册</button></div>
    <div class="field"><label>账号</label><input class="input" placeholder="请输入账号"></div>
    <div class="field" style="margin-top:10px"><label>密码</label><input class="input" type="password" placeholder="请输入密码"></div>
    <button class="btn btn-dark btn-block" style="height:44px;margin-top:14px">登录</button>
    <div class="login-note">买家 / 卖家可自助注册；管理员账号由系统初始化</div>
  </div>
</div></div>
    </div>
    
  </div>
</body>
</html>
