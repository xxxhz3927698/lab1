<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理员违规处理</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone ">
    <div class="statusbar"><span>9:41</span><span class="status-right"><span class="status-bars">▮▮▮</span><span>5G</span><span>▰</span></span></div>
    <div class="app">
      <div class="content "><div class="page-header"><div class="header-left"><div><h1>违规处理</h1><p>移除商品会同步取消相关预约</p></div></div><div><div class="header-icon">⌕</div></div></div>
<div class="search-line"><input class="input" value="九成新机械键盘"><button class="btn btn-dark">搜索</button></div>
<div class="pad" style="padding-top:6px">
  <div class="list-card"><div class="card-top"><div><h3>九成新机械键盘</h3><p>卖家 林同学 · 商品编号 #1 · 版本 4</p></div><span class="badge badge-yellow">已预订</span></div><p class="card-desc">当前有 1 条已确认预约。违规移除后预约会取消，商品从公开市场消失。</p><div class="card-actions"><button class="btn btn-danger btn-sm">违规移除</button></div></div>
</div>
<div class="overlay">
  <div class="sheet">
    <h3>违规移除商品</h3>
    <p>请填写处理理由。该操作会取消相关预约，并写入不可修改的操作日志。</p>
    <div class="field"><label>处理理由</label><textarea class="textarea" rows="3">商品描述包含违规联系方式，违反平台发布规范。</textarea></div>
    <div class="notice red" style="margin-top:10px">商品将变为“违规移除”，已确认预约会变为“已取消”。</div>
    <div class="sheet-actions"><button class="btn btn-ghost">取消</button><button class="btn btn-dark">确认移除</button></div>
  </div>
</div></div>
    </div>
    <div class="bottom-nav"><div class="nav-item"><span class="nav-icon">✓</span><span>审核</span></div><div class="nav-item active"><span class="nav-icon">!</span><span>违规</span></div><div class="nav-item"><span class="nav-icon">♙</span><span>用户</span></div><div class="nav-item"><span class="nav-icon">≡</span><span>日志</span></div><div class="nav-item"><span class="nav-icon">◫</span><span>统计</span></div></div>
  </div>
</body>
</html>
